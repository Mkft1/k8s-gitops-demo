apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mkft1/k8s-gitops-demo.git
    targetRevision: HEAD
    path: monitoring
    helm:
      valueFiles:
        - vm-values.yaml
      repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
