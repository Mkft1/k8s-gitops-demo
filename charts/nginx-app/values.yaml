replicaCount: 2

image:
  # Используем unprivileged версию, так как обычный nginx под пользователем 101 не запустится
  repository: nginxinc/nginx-unprivileged
  pullPolicy: IfNotPresent
  tag: "1.25-alpine"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080 # unprivileged nginx по умолчанию слушает порт 8080

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []

# 3. Исправляем no-anti-affinity: подвязываем под точный селектор Helm
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - nginx-app  # Значение должно совпадать с названием вашего чарта (Chart.name)
      topologyKey: kubernetes.io/hostname

autoscaling:
  enabled: false

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101
  allowPrivilegeEscalation: false
