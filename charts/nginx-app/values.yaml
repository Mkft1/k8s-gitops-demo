# charts/nginx-app/values.yaml

# Настройки приложения
replicaCount: 2

image:
  repository: nginx/nginx-unprivileged
  pullPolicy: IfNotPresent
  tag: "1.25.3-alpine" 

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Настройки сервиса
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ресурсы
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

# Настройки NodeSelector, Tolerations, Affinity 
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - nginx-app  # Убедитесь, что это совпадает с именем вашего чарта в Chart.yaml
      topologyKey: kubernetes.io/hostname

autoscaling:
  enabled: false

# Безопасность контейнера
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101               # UID пользователя nginx в alpine образе
  allowPrivilegeEscalation: false

