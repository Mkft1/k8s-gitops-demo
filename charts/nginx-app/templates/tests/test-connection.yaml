apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nginx-app.fullname" . }}-test-connection"
  labels:
    app.kubernetes.io/name: {{ include "nginx-app.name" . }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "nginx-app.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
