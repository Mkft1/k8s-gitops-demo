apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nginx-app.fullname" . }}-netpol
  labels:
    app.kubernetes.io/name: {{ include "nginx-app.name" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nginx-app.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
  egress:
    - {} # разрешен исходящий трафик
