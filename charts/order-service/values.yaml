replicaCount: 2

image:
  repository: order-service
  tag: "v2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - order-service
        topologyKey: kubernetes.io/hostname

envFromSecret: app-credentials

env:
  - name: RABBITMQ_HOST
    value: "rabbitmq"
  - name: RABBITMQ_PORT
    value: "5672"
  - name: POSTGRES_HOST
    value: "postgres-db"
  - name: POSTGRES_PORT
    value: "5432"
  - name: POSTGRES_DB
    value: "orders_db"
