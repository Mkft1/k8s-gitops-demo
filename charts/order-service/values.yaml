replicaCount: 2

image:
  repository: ghcr.io/Mkft1/k8s-gitops-demo/order-service
  tag: "382f7e3"  # ВРЕМЕННО: конкретный тег вместо latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - order-service
          topologyKey: kubernetes.io/hostname

envFromSecret: app-credentials

env:
  - name: RABBITMQ_HOST
    value: "rabbitmq"
  - name: RABBITMQ_PORT
    value: "5672"
  - name: POSTGRES_HOST
    value: "postgres-db"
  - name: POSTGRES_PORT
    value: "5432"
  - name: POSTGRES_DB
    value: "orders_db"
