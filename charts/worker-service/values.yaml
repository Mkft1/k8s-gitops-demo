replicaCount: 1  # Для воркера часто достаточно 1 реплики, если нет дикой нагрузки
image:
  repository: worker-service
  tag: "v1"
  pullPolicy: IfNotPresent
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
envFromSecret: app-credentials
env:
  - name: RABBITMQ_HOST
    value: "rabbitmq"
  - name: POSTGRES_HOST
    value: "postgres-db"
