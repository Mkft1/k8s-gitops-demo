replicaCount: 1

image:
  repository: ghcr.io/mkft1/k8s-gitops-demo/worker-service
  tag: "dfe2afa"
  pullPolicy: Always

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

envFromSecret: app-credentials

env:
  - name: RABBITMQ_HOST
    value: "rabbitmq"
  - name: POSTGRES_HOST
    value: "postgres-db"
