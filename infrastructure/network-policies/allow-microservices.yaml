apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-microservices-traffic
  namespace: production
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
    # Разрешаем входной трафик только от подов внутри production
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: production
      ports:
      - protocol: TCP
        port: 8000   # Order/Notification API
      - protocol: TCP
        port: 5672   # RabbitMQ AMQP
  egress:
    # Разрешаем исходящий трафик к RabbitMQ и Postgres
    - to:
      - podSelector:
          matchLabels:
            app: rabbitmq
      ports:
      - protocol: TCP
        port: 5672
    # Разрешаем DNS (иначе поды не смогут резолвить имена)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
