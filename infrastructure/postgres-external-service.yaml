apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: production
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-db
  namespace: production
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
