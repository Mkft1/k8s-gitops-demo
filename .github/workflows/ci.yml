name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. GITLEAKS
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. DATREE (рендерим Helm, потом проверяем)
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Render Helm templates
        run: helm template my-app charts/nginx-app > rendered-manifests.yaml

      - name: Run Datree on rendered manifests
        uses: datreeio/action-datree@main
        with:
          path: 'rendered-manifests.yaml'
          cliArguments: '--only-k8s-files'

      # 3. TRIVY
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'charts/nginx-app/'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
