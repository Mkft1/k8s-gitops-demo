name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. GITLEAKS: Ищем утечки секретов (работает без токена для базовой проверки)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. KUBE-LINTER: Проверка best practices K8s (100% Open Source, без токенов!)
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Render Helm templates
        run: helm template my-app charts/nginx-app > rendered-manifests.yaml

      - name: Run Kube-linter
        run: |
          # Скачиваем последнюю версию kube-linter напрямую с GitHub Releases
          curl -L -o kube-linter https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux
          chmod +x kube-linter
          
          # Запускаем проверку. Если найдены ошибки, он вернет код 1 и упадет пайплайн
          ./kube-linter lint rendered-manifests.yaml

      # 3. TRIVY: Сканирование конфигураций на CVE (также полностью Open Source)
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'charts/nginx-app/'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
