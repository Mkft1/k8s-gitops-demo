name: Build, Scan, Sign and Push

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Name of the microservice (e.g., order-service)'
        required: true
        type: string
      context:
        description: 'Build context path (e.g., ./microservices/order-service)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: true
        type: string
      chart_path:
        description: 'Path to Helm chart (e.g., charts/order-service)'
        required: true
        type: string
    outputs:
      image_digest:
        description: 'SHA256 digest of the pushed image'
        value: ${{ jobs.build-and-push.outputs.image_digest }}
      image_tag:
        description: 'Short SHA tag of the image'
        value: ${{ jobs.build-and-push.outputs.image_tag }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for Cosign keyless signing
      security-events: write  # For Trivy SARIF upload
    
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}
    
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/${{ inputs.service_name }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Gitleaks
      
      # === SECURITY CHECKS ===
      
      - name: Run Gitleaks (secrets detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'
      
      - name: Render Helm templates
        run: helm template ${{ inputs.service_name }} ${{ inputs.chart_path }} > rendered-manifests.yaml
      
      - name: Run Kube-linter (K8s best practices)
        run: |
          curl -L -o kube-linter https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux
          chmod +x kube-linter
          ./kube-linter lint rendered-manifests.yaml
      
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '${{ inputs.chart_path }}/'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      # === BUILD AND PUSH ===
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # === IMAGE SECURITY SCAN ===
      
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      # === IMAGE SIGNING (COSIGN KEYLESS) ===
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
      
      - name: Sign the container image
        run: |
          cosign sign --yes \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1
